openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CollBar — Collective Bargaining Compensation Modeling API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: districts
    description: District configuration
  - name: bargaining-units
    description: Bargaining unit management
  - name: employees
    description: Employee roster management
  - name: salary-schedules
    description: Salary schedule management
  - name: hourly-schedules
    description: Hourly schedule management
  - name: scenarios
    description: Scenario modeling
  - name: heatmap
    description: Heatmap visualization data
  - name: dashboard
    description: Dashboard overview data
  - name: employee-groups
    description: Employee group management
  - name: compensation-schedules
    description: Compensation schedule management
  - name: stipends
    description: Stipend table definitions and employee assignments
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /districts:
    get:
      operationId: listDistricts
      tags: [districts]
      summary: List all districts
      responses:
        "200":
          description: List of districts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/District"
    post:
      operationId: createDistrict
      tags: [districts]
      summary: Create a district
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDistrictRequest"
      responses:
        "201":
          description: Created district
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/District"

  /districts/{id}:
    get:
      operationId: getDistrict
      tags: [districts]
      summary: Get a district
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: District
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/District"
    put:
      operationId: updateDistrict
      tags: [districts]
      summary: Update a district
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDistrictRequest"
      responses:
        "200":
          description: Updated district
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/District"

  /bargaining-units:
    get:
      operationId: listBargainingUnits
      tags: [bargaining-units]
      summary: List bargaining units
      parameters:
        - name: districtId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of bargaining units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BargainingUnit"
    post:
      operationId: createBargainingUnit
      tags: [bargaining-units]
      summary: Create a bargaining unit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBargainingUnitRequest"
      responses:
        "201":
          description: Created bargaining unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BargainingUnit"

  /bargaining-units/{id}:
    get:
      operationId: getBargainingUnit
      tags: [bargaining-units]
      summary: Get a bargaining unit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bargaining unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BargainingUnit"
    put:
      operationId: updateBargainingUnit
      tags: [bargaining-units]
      summary: Update a bargaining unit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBargainingUnitRequest"
      responses:
        "200":
          description: Updated bargaining unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BargainingUnit"
    delete:
      operationId: deleteBargainingUnit
      tags: [bargaining-units]
      summary: Delete a bargaining unit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List employees
      parameters:
        - name: districtId
          in: query
          schema:
            type: string
        - name: bargainingUnitId
          in: query
          schema:
            type: string
        - name: employeeGroupId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: contractYear
          in: query
          schema:
            type: number
        - name: page
          in: query
          schema:
            type: number
            default: 1
        - name: pageSize
          in: query
          schema:
            type: number
            default: 50
      responses:
        "200":
          description: Paginated list of employees
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeList"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeRequest"
      responses:
        "201":
          description: Created employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/retirement-eligible:
    get:
      operationId: listRetirementEligibleEmployees
      tags: [employees]
      summary: List retirement-eligible employees with incentive calculations
      parameters:
        - name: districtId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of retirement-eligible employees with calculations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RetirementEligibleEmployee"

  /employees/import:
    post:
      operationId: importEmployees
      tags: [employees]
      summary: Bulk import employees from CSV/Excel data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportEmployeesRequest"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get an employee with projections
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: scenarioId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Employee with projections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeWithProjections"
    put:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRequest"
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Delete an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /employees/{id}/pending:
    delete:
      operationId: discardPendingChange
      tags: [employees]
      summary: Discard a pending future position change for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated employee with pending change cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /salary-schedules:
    get:
      operationId: listSalarySchedules
      tags: [salary-schedules]
      summary: List salary schedules
      parameters:
        - name: bargainingUnitId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of salary schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalarySchedule"
    post:
      operationId: createSalarySchedule
      tags: [salary-schedules]
      summary: Create a salary schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSalaryScheduleRequest"
      responses:
        "201":
          description: Created schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalarySchedule"

  /salary-schedules/{id}:
    get:
      operationId: getSalarySchedule
      tags: [salary-schedules]
      summary: Get a salary schedule with full grid
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Salary schedule with lanes, steps, cells
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryScheduleWithGrid"
    delete:
      operationId: deleteSalarySchedule
      tags: [salary-schedules]
      summary: Delete a salary schedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /hourly-schedules:
    get:
      operationId: listHourlySchedules
      tags: [hourly-schedules]
      summary: List hourly schedules
      parameters:
        - name: bargainingUnitId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of hourly schedules with categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HourlyScheduleWithCategories"
    post:
      operationId: createHourlySchedule
      tags: [hourly-schedules]
      summary: Create a hourly schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHourlyScheduleRequest"
      responses:
        "201":
          description: Created hourly schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HourlyScheduleWithCategories"

  /scenarios:
    get:
      operationId: listScenarios
      tags: [scenarios]
      summary: List scenarios
      parameters:
        - name: districtId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of scenarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScenarioSummary"
    post:
      operationId: createScenario
      tags: [scenarios]
      summary: Create a scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScenarioRequest"
      responses:
        "201":
          description: Created scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"

  /scenarios/compare:
    get:
      operationId: compareScenarios
      tags: [scenarios]
      summary: Compare multiple scenarios side by side
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated scenario IDs
        - name: districtId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Side-by-side scenario comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioComparison"

  /scenarios/{id}:
    get:
      operationId: getScenario
      tags: [scenarios]
      summary: Get a scenario with year configs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scenario with year configs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
    put:
      operationId: updateScenario
      tags: [scenarios]
      summary: Update a scenario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScenarioRequest"
      responses:
        "200":
          description: Updated scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
    delete:
      operationId: deleteScenario
      tags: [scenarios]
      summary: Delete a scenario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /scenarios/{id}/calculate:
    post:
      operationId: calculateScenario
      tags: [scenarios]
      summary: Calculate projections for a scenario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Calculation summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioCalculationResult"

  /scenarios/{id}/apply:
    post:
      operationId: applyScenario
      tags: [scenarios]
      summary: Apply a scenario as final (locks in projections)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Applied scenario result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioCalculationResult"

  /scenarios/{id}/year-configs:
    post:
      operationId: upsertScenarioYearConfigs
      tags: [scenarios]
      summary: Upsert year configs for a scenario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ScenarioYearConfig"
      responses:
        "200":
          description: Updated year configs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScenarioYearConfig"

  /scenarios/{id}/summary:
    get:
      operationId: getScenarioSummary
      tags: [scenarios]
      summary: Get year-by-year summary for a scenario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Year-by-year summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioCalculationResult"

  /heatmap/{scenarioId}:
    get:
      operationId: getHeatmapData
      tags: [heatmap]
      summary: Get heatmap data for a scenario (all years)
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: string
        - name: bargainingUnitId
          in: query
          schema:
            type: string
        - name: employeeGroupId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Heatmap data for all contract years
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatmapData"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard overview data
      parameters:
        - name: districtId
          in: query
          schema:
            type: string
        - name: scenarioId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardData"

  /employees/export:
    get:
      operationId: exportEmployees
      tags: [employees]
      summary: Export full employee roster as CSV
      parameters:
        - name: districtId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string

  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List available scenario reports for a district
      parameters:
        - name: districtId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of scenario report summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportSummary"

  /reports/generate:
    post:
      operationId: generateReport
      tags: [reports]
      summary: Generate a report for a scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenarioId]
              properties:
                scenarioId:
                  type: string
                format:
                  type: string
                  enum: [json, csv]
                includeEmployeeDetail:
                  type: boolean
      responses:
        "200":
          description: Generated report data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportData"
            text/csv:
              schema:
                type: string

  /reports/{scenarioId}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get report summary for a specific scenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Report summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportData"
        "404":
          description: Scenario or records not found

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get district settings and bargaining unit configurations
      parameters:
        - name: districtId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: District settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistrictSettings"

  /settings/district/{id}:
    get:
      operationId: getDistrictSettings
      tags: [settings]
      summary: Get settings for a specific district
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: District record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/District"
    put:
      operationId: updateDistrictSettings
      tags: [settings]
      summary: Update district settings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                state:
                  type: string
                fiscalYearStart:
                  type: string
                timezone:
                  type: string
      responses:
        "200":
          description: Updated district
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/District"

  /settings/bargaining-unit/{id}:
    get:
      operationId: getBargainingUnitSettings
      tags: [settings]
      summary: Get settings for a specific bargaining unit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bargaining unit record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BargainingUnit"
    put:
      operationId: updateBargainingUnitSettings
      tags: [settings]
      summary: Update bargaining unit settings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated bargaining unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BargainingUnit"

  /employee-groups:
    get:
      operationId: listEmployeeGroups
      tags: [employee-groups]
      summary: List employee groups
      parameters:
        - name: districtId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of employee groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeGroupWithSchedules"
    post:
      operationId: createEmployeeGroup
      tags: [employee-groups]
      summary: Create an employee group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeGroupRequest"
      responses:
        "201":
          description: Created employee group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeGroupWithSchedules"

  /employee-groups/{id}:
    get:
      operationId: getEmployeeGroup
      tags: [employee-groups]
      summary: Get an employee group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Employee group with schedules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeGroupWithSchedules"
    put:
      operationId: updateEmployeeGroup
      tags: [employee-groups]
      summary: Update an employee group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeGroupRequest"
      responses:
        "200":
          description: Updated employee group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeGroupWithSchedules"
    delete:
      operationId: deleteEmployeeGroup
      tags: [employee-groups]
      summary: Delete an employee group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /compensation-schedules:
    get:
      operationId: listCompensationSchedules
      tags: [compensation-schedules]
      summary: List compensation schedules
      parameters:
        - name: employeeGroupId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of compensation schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompensationSchedule"
    post:
      operationId: createCompensationSchedule
      tags: [compensation-schedules]
      summary: Create a compensation schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompensationScheduleRequest"
      responses:
        "201":
          description: Created compensation schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompensationSchedule"

  /compensation-schedules/{id}:
    get:
      operationId: getCompensationSchedule
      tags: [compensation-schedules]
      summary: Get a compensation schedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Compensation schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompensationSchedule"
    put:
      operationId: updateCompensationSchedule
      tags: [compensation-schedules]
      summary: Update a compensation schedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompensationScheduleRequest"
      responses:
        "200":
          description: Updated compensation schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompensationSchedule"
    delete:
      operationId: deleteCompensationSchedule
      tags: [compensation-schedules]
      summary: Delete a compensation schedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /compensation-schedules/{id}/set-primary:
    post:
      operationId: setCompensationSchedulePrimary
      tags: [compensation-schedules]
      summary: Set a compensation schedule as primary for its group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated compensation schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompensationSchedule"

  /compensation-schedules/{scheduleId}/stipend-definitions:
    get:
      operationId: listStipendDefinitions
      tags: [stipends]
      summary: List stipend definitions for a compensation schedule
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of stipend definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StipendDefinition"
        "404":
          description: Compensation schedule not found
    post:
      operationId: createStipendDefinition
      tags: [stipends]
      summary: Create a stipend definition on a compensation schedule
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStipendDefinitionRequest"
      responses:
        "201":
          description: Created stipend definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StipendDefinition"
        "404":
          description: Compensation schedule not found

  /stipend-definitions/{id}:
    get:
      operationId: getStipendDefinition
      tags: [stipends]
      summary: Get a stipend definition with its employee assignments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stipend definition with assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StipendDefinitionWithAssignments"
        "404":
          description: Stipend definition not found
    put:
      operationId: updateStipendDefinition
      tags: [stipends]
      summary: Update a stipend definition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStipendDefinitionRequest"
      responses:
        "200":
          description: Updated stipend definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StipendDefinition"
        "404":
          description: Stipend definition not found
    delete:
      operationId: deleteStipendDefinition
      tags: [stipends]
      summary: Delete a stipend definition (cascades employee assignments)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /stipend-definitions/{definitionId}/assignments:
    get:
      operationId: listStipendAssignments
      tags: [stipends]
      summary: List employee assignments for a stipend definition
      parameters:
        - name: definitionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of employee stipend assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeStipendAssignment"
    post:
      operationId: createStipendAssignment
      tags: [stipends]
      summary: Assign an employee to a stipend
      parameters:
        - name: definitionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStipendAssignmentRequest"
      responses:
        "201":
          description: Created stipend assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeStipendAssignment"
        "404":
          description: Stipend definition not found

  /stipend-assignments/{id}:
    put:
      operationId: updateStipendAssignment
      tags: [stipends]
      summary: Update a stipend assignment (override amount, hours/events, notes)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStipendAssignmentRequest"
      responses:
        "200":
          description: Updated stipend assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeStipendAssignment"
        "404":
          description: Stipend assignment not found
    delete:
      operationId: deleteStipendAssignment
      tags: [stipends]
      summary: Remove an employee from a stipend
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /employees/{employeeId}/stipends:
    get:
      operationId: listEmployeeStipends
      tags: [stipends]
      summary: List all stipend assignments for an employee (with definition details)
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of employee stipend assignments with definition details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeStipendWithDefinition"

